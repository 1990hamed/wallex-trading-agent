[project]
name = "wallex-trading-agent-hackathon"
version = "0.1.0"
description = "Auditable LangGraph trading agent for the Wallex hackathon"
readme = "README.md"
authors = [
    { name = "Hamed", email = "shahbazihamed1990@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langchain-openai>=1.0.0",
    "langchain-mcp-adapters>=0.1.13",
    "langgraph>=1.0.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[project.scripts]
wallex-trading-agent = "wallex_trading_agent:main"
wallex-backtest = "wallex_trading_agent.backtest_runner:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wallex_trading_agent"
